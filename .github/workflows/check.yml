name: check

on:
  push:
    branches: [main]
  pull_request:

# The suite only reads the checkout. Without this the token carries whatever
# the repository's default grants, which a pull request's code then runs with.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Replaces the block above for this job, so `contents` is repeated. The
    # write on packages is for publishing the devcontainer image as a build
    # cache. A pull request from a fork is capped to read by GitHub whatever
    # is asked for here; one from Dependabot is not - its token is read-only
    # by default, and this block raises it. Only the ref filter on the push
    # below keeps such a run from publishing.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The claude-mount feature bind-mounts ~/.claude unconditionally, and a
      # bind whose source is missing aborts `docker run` rather than being
      # skipped. The runner has no ~/.claude, so create an empty one: the mount
      # then succeeds and stays the no-op `just check` already assumes it is.
      - run: mkdir -p ~/.claude
      # For pulling the cache image, and on main for pushing it.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The suite runs inside the devcontainer rather than on the runner, so the
      # toolchain CI checks with is by construction the one the container
      # defines. Every version lives once, in devcontainer.json; there is no
      # second install path here to keep in step with it.
      #
      # An experiment: the image a push to main builds is published and used as
      # the layer cache of every later build, which turns the container build
      # into a pull - this step went from ~165s to ~93s. It is a cache and
      # nothing more: devcontainer.json still names the base image and the
      # features, and a run that cannot pull the image logs the importer's
      # error and builds everything as before. So does a run that changes any
      # feature, whichever one: the build copies every feature's install
      # content in one early layer, and all the feature layers sit on top of
      # it. A Dependabot pull request can read the image; nothing but a push
      # to main writes it.
      - uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/nicoviii/claude-config-devcontainer
          cacheFrom: ghcr.io/nicoviii/claude-config-devcontainer
          push: filter
          refFilterForPush: refs/heads/main
          eventFilterForPush: push
          runCmd: just check
