name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: extractions/setup-just@v4
      # Same entry point as the pre-commit hook, so CI cannot drift from what
      # the hook accepted locally.
      - run: just check
