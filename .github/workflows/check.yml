name: check

on:
  push:
    branches: [main]
  pull_request:

# The suite only reads the checkout. Without this the token carries whatever
# the repository's default grants, which a pull request's code then runs with.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The claude-mount feature bind-mounts ~/.claude unconditionally, and a
      # bind whose source is missing aborts `docker run` rather than being
      # skipped. The runner has no ~/.claude, so create an empty one: the mount
      # then succeeds and stays the no-op `just check` already assumes it is.
      - run: mkdir -p ~/.claude
      # The suite runs inside the devcontainer rather than on the runner, so the
      # toolchain CI checks with is by construction the one the container
      # defines. Every version lives once, in devcontainer.json; there is no
      # second install path here to keep in step with it.
      #
      # An experiment: the build takes its layers from the image `publish-cache`
      # below pushes, which turns it into a pull - this step went from ~165s to
      # ~93s. It is a cache and nothing more: devcontainer.json still names the
      # base image and the features, and a run that cannot pull the image logs
      # the importer's error and builds everything as before. So does a run
      # that changes any feature, whichever one: the build copies every
      # feature's install content in one early layer, and all the feature
      # layers sit on top of it.
      #
      # The image is public, which is what lets this job read it without a
      # login and without any permission on packages. It must not have one: a
      # pull request runs code nobody has reviewed - a bumped action, on the
      # runner - and what it could write here is what every later run builds
      # from. GitHub caps a fork's token to read whatever a job asks for, but
      # not Dependabot's, which a `permissions` block raises.
      - uses: devcontainers/ci@v0.3
        with:
          cacheFrom: ghcr.io/nicoviii/claude-config-devcontainer
          push: never
          runCmd: just check

  # Its own job so that the write on packages exists only here, and here only
  # on a push to main. The price is a second container build per push, beside
  # the one `check` does: a pull while .devcontainer is unchanged, a full build
  # when it is not. It does not wait for `check`, because the image is the
  # devcontainer as defined, whatever the suite makes of the commit.
  publish-cache:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Replaces the block at the top for this job, so `contents` is repeated.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No runCmd: the image is built and pushed and no container is started,
      # so the ~/.claude that claude-mount binds is not needed here.
      - uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/nicoviii/claude-config-devcontainer
          cacheFrom: ghcr.io/nicoviii/claude-config-devcontainer
          push: always
