# Run `lefthook install` once per clone to activate these.
pre-commit:
  jobs:
    # Most commits here touch only skills and markdown; the glob keeps those
    # instant and pays the build/test cost only when F# actually changed.
    - name: fsharp
      glob:
        - "*.fs"
        - "*.fsproj"
      run: just typecheck test

    # Split out rather than folded into the glob above so a shell-only commit
    # lints in milliseconds instead of waiting on a full dotnet build.
    - name: shell
      glob: "*.sh"
      run: just shell
